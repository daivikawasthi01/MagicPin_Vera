name: Keep Bot Warm

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bot Healthz Endpoint
        env:
          BOT_URL: ${{ secrets.BOT_URL || 'https://magicpin-vera-cyqp.onrender.com' }}
        run: |
          echo "Pinging ${BOT_URL}/v1/healthz..."
          curl -f -s -m 30 "${BOT_URL}/v1/healthz" || echo "Warmup ping completed or timed out"
